name = "Alerte missile — barrage de deux bâtiments"
brief = """Deux bâtiments ennemis, signalés par le renseignement, tiennent la mer à l'ancre, l'un au nord, l'autre
au sud de la route du porteur, à une dizaine de milles l'un de l'autre. Chacun
surveille une zone de vingt-quatre milles autour de lui : dès que le porteur y
entre, il l'illumine (conduite de tir), laisse un délai de verrouillage, puis
tire un missile toutes les deux minutes tant que le porteur reste dans sa zone.
Sortir de la zone leur fait perdre le verrouillage — il faudra qu'ils le
refassent. Du trafic marchand passe alentour."""
attendu = """Deux alertes se succèdent : d'abord « conduite de tir ennemie » (avec le
relèvement), puis « départ missile ». Les missiles rasants ne sont pistés qu'à
l'horizon radio, environ deux minutes avant l'impact, et les leurres n'agissent
que dans les cinq derniers milles. Plusieurs missiles à la fois : la console
cadre la zone au lieu de suivre un seul missile, et accroche le plus pressant.
Un seul missile : elle le suit. Leurres, SAM, ou demi-tour hors de la zone —
le CIWS ne tire pas seul ici. Trop tard, le porteur est touché et la
simulation s'arrête."""

name_en = "Missile alert — two-ship barrier"
brief_en = """Two enemy vessels hold station at sea, one north and one south of own
ship's route, about ten miles apart. Each watches a twenty-four mile zone
around itself: as soon as own ship enters it, it illuminates (fire control),
waits a lock-on delay, then fires one missile every two minutes for as long as
own ship stays in its zone. Leaving the zone makes them lose the lock — they
have to re-acquire. Merchant traffic passes around."""
attendu_en = """Two alerts in sequence: first "enemy fire control" (with a bearing),
then "missile launch". Sea-skimming missiles are only tracked at the radio
horizon, about two minutes before impact, and decoys only work in the last
five miles. Several missiles at once: the console frames the area instead of
following a single one, and hooks the most pressing. A single missile: it
follows it. Decoys, SAM, or a U-turn out of the zone — CIWS does not fire on its
own here. Too late, and own ship is hit and the simulation stops."""

seed = 909
duration = 1500

