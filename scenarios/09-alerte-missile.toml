name = "Alerte missile — verrouillage et salve"
brief = """Veille dans le golfe de Finlande, trafic marchand autour. Trois bâtiments
ennemis convergent sur le porteur : deux vedettes qui se sont tenues sous
l'horizon radio, et un avion de patrouille maritime. Personne ne tire à une
heure fixée : chacun illumine dès qu'il est à portée de tir, laisse un délai
de verrouillage, puis tire sa salve. La chronologie dépend de la route du
porteur."""
attendu = """L'alerte arrive en deux temps : d'abord « conduite de tir ennemie »
(l'ESM entend l'illumination, avec le relèvement), puis « départ missile ». Les
missiles rasants ne sont pistés qu'à l'horizon radio, environ deux minutes
avant l'impact, et les leurres n'agissent que dans les cinq derniers milles :
il faut suivre la menace (SUIVI), attendre la fenêtre et larguer, plusieurs fois
si besoin — chaque largage n'en séduit que 45 %. Trop tôt, il ne se passe rien ;
trop tard, le porteur est touché et la simulation s'arrête. Le SAM et le CIWS
sont l'autre réponse."""

name_en = "Missile alert — lock-on and salvo"
brief_en = """Watch in the Gulf of Finland, merchant traffic around. Three enemy
units converge on own ship: two fast boats that stayed under the radio horizon,
and a maritime patrol aircraft. Nobody fires at a set time: each illuminates as
soon as it is within firing range, waits a lock-on delay, then fires its salvo.
The timeline depends on own ship's course."""
attendu_en = """The alert comes in two steps: first "enemy fire control on us" (ESM
hears the illumination, with a bearing), then "missile launch". Sea-skimming
missiles are only tracked at the radio horizon, about two minutes before
impact, and decoys only work in the last five miles: follow the threat
(FOLLOW), wait for the window and deploy, several times if needed — each
deployment seduces only 45% of them. Too early, nothing happens; too late, own
ship is hit and the simulation stops. SAM and CIWS are the other answer."""

seed = 909
duration = 900

