name = "Approches de Gibraltar — positions en lat/lon"
brief = """Le porteur fait route vers le détroit de Gibraltar, à l'ouest de la
péninsule, dans le trafic du dispositif de séparation du cap Trafalgar. Même
mise en scène que « Flotte mixte » — deux alliés, trois marchands qui déclarent
leur identité, deux silencieux, trois hostiles — mais chaque bâtiment est posé
par sa vraie latitude/longitude, sur la carte du monde, et non plus par un
gisement et une distance depuis le porteur."""
attendu = """Le comportement de classement est celui du scénario 07 : alliés AMI,
marchands NEUTRE, silencieux INCONNUS, hostiles classés par doctrine dès qu'ils
allument leur conduite de tir. Ce qui change, c'est le décor : trait de côte
d'Espagne et du Maroc au bon endroit, et le radar qui s'arrête à son horizon
plutôt qu'à un rayon arbitraire."""

name_en = "Approaches to Gibraltar — lat/lon positions"
brief_en = """Own ship heads for the Strait of Gibraltar, west of the peninsula, in
the Cape Trafalgar traffic separation scheme. Same set-up as "Mixed fleet" — two
allies, three merchants declaring their identity, two silent contacts, three
hostiles — but every vessel is placed by its real latitude/longitude on the
world map, no longer by a bearing and range from own ship."""
attendu_en = """Classification behaves as in scenario 07: allies FRIEND, merchants
NEUTRAL, silent ones UNKNOWN, hostiles classified by doctrine once they light
their fire control. What changes is the setting: Spanish and Moroccan coasts in
the right place, and the radar stopping at its horizon rather than at an
arbitrary radius."""

seed = 8008
duration = 900

