name = "Avarie refroidissement sous menace"
brief = """Même géométrie d'attaque que la saturation antinavire, mais la pompe de
production d'eau glacée s'arrête à 60 secondes. La température des baies radar
monte, l'émission est déclassée, le SNR chute — et la distance à laquelle on
détecte un missile de 0,09 m² recule d'autant."""
attendu = """Démonstration du couplage plateforme / combat : un défaut d'automate
réduit physiquement la capacité de veille. La détection des missiles se fait plus
tard, la butée de tir SAM peut passer en négatif, et la défense se joue au CIWS
et aux leurres. La bonne réaction est côté IPMS — relancer la pompe — autant que
côté CMS."""
seed = 4212
duration = 560

