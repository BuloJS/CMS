name = "Veille en zone de trafic réel"
brief = """Pas de scénario. Le porteur tient une veille au milieu du golfe de
Finlande, sur le rail Helsinki–Tallinn, et la console affiche du trafic reçu par
AIS, passé au travers du modèle de senseurs : équation radar en R⁴, horizon radio, bruit de mesure,
pistage. Ce qui est à l'écran n'est pas la vérité AIS, c'est ce que le bâtiment
en perçoit.

Par défaut la source est l'instantané SYNTHÉTIQUE livré avec le dépôt, pour que
le scénario tourne sans réseau — le bandeau AIS le dit en clair. Pour le flux
public réel : AIS_SOURCE=digitraffic python3 services/server.py"""
attendu = """Les grands navires sortent à l'horizon, limités par lui et non par
le bilan de liaison. Les petits mobiles — voiliers, pilotines, bateaux de pêche —
n'apparaissent que de près, et leurs pistes se dégradent dès qu'un plot manque.
La corrélation AIS renseigne l'identité des coopératifs et laisse les autres en
inconnu."""

# Traduction anglaise, facultative : la console la sert aux
# opérateurs qui ne lisent pas le français.
name_en = "Watch in real traffic"
brief_en = """No scripted contacts. Own ship keeps watch in the middle of the Gulf
of Finland, on the Helsinki–Tallinn lane, and the console shows traffic received
by AIS, passed through the sensor model: R⁴ radar equation, radio horizon,
measurement noise, tracking. What is on screen is not AIS truth, it is what the
ship perceives.

The default source is the SYNTHETIC snapshot shipped with the repository, so the
scenario runs without a network — the AIS strip says so in plain sight. For the
real public feed: AIS_SOURCE=digitraffic python3 services/server.py"""
attendu_en = """Large ships appear at the horizon, limited by it rather than by the
link budget. Small craft — sailing boats, pilot vessels, fishing boats — only
show up close, and their tracks degrade as soon as a plot is missed. AIS
correlation identifies the cooperative ones and leaves the rest unknown."""

seed = 1
duration = 3600

# Au milieu du golfe de Finlande, sur le rail Helsinki–Tallinn : quinze
# milles d'eau libre dans toutes les directions, et en plein trafic. Un
# bâtiment en veille ne se met pas à deux milles d'un port, au milieu
# des skerries — la position se vérifie avec tools/eaux.py.
[origine]
lat = 59.90
lon = 25.25

[ownship]
course = 90
speed_kt = 10
mast_m = 30

# Aucun contact scripté : tout ce qui apparaîtra vient du flux AIS. Le
# scénario doit donc réclamer lui-même sa source de données, sinon il s'ouvre
# sur un scope vide sans que rien explique pourquoi.
#
# Il ne peut demander que l'instantané hors ligne : ouvrir un fichier de
# scénario ne doit pas déclencher de trafic réseau. Pour le flux public réel,
# c'est un acte explicite de l'exploitant :
#
#     AIS_SOURCE=digitraffic python3 services/server.py
[ais]
source = "fichier"
rayon_nm = 60
