name = "Veille en zone de trafic réel"
brief = """Pas de scénario. Le porteur tient une veille au large d'Helsinki et
la console affiche le trafic maritime réel, reçu par AIS et passé au travers du
modèle de senseurs : équation radar en R⁴, horizon radio, bruit de mesure,
pistage. Ce qui est à l'écran n'est pas la vérité AIS, c'est ce que le
bâtiment en perçoit."""
attendu = """Les grands navires sortent à l'horizon, limités par lui et non par
le bilan de liaison. Les petits mobiles — voiliers, pilotines, bateaux de pêche —
n'apparaissent que de près, et leurs pistes se dégradent dès qu'un plot manque.
La corrélation AIS renseigne l'identité des coopératifs et laisse les autres en
inconnu."""
seed = 1
duration = 3600

# Au large d'Helsinki, au centre de la zone couverte par le flux AIS public
# finlandais. Le rayon d'ingestion par défaut est de 60 NM.
[origine]
lat = 60.10
lon = 24.90

[ownship]
course = 90
speed_kt = 10
mast_m = 30

# Aucun contact scripté : tout ce qui apparaîtra vient du flux.
