name = "Détroit — approche non coopérative"
brief = """Transit à vitesse réduite dans un rail resserré, trafic marchand dense
et coopératif. Deux embarcations rapides non identifiées quittent la côte et
convergent sur le porteur. L'enjeu n'est pas le tir : c'est l'identification
dans un environnement où l'erreur se paie."""
attendu = """Interrogation IFF, corrélation AIS, classement en neutre du trafic
marchand. La vedette qui persiste après manœuvre d'évitement et qui illumine en
conduite de tir bascule hostile : la solution proposée est l'ARTILLERIE 76 mm,
pas le SAM — cible de surface, courte distance, effet gradué."""

# Traduction anglaise, facultative : la console la sert aux
# opérateurs qui ne lisent pas le français.
name_en = "Strait — non-cooperative approach"
brief_en = """Reduced-speed transit in a narrow traffic lane, dense and cooperative
merchant traffic. Two unidentified fast craft leave the coast and close on own
ship. The issue is not opening fire: it is identification in an environment
where a mistake is paid for."""
attendu_en = """IFF interrogation, AIS correlation, merchant traffic classified
neutral. The craft that persists after the avoidance manoeuvre and illuminates
with fire control turns hostile: the proposed solution is the 76 mm GUN, not the
SAM — surface target, short range, graduated effect."""

seed = 7314
duration = 600

# Ancrage géographique du plan tangent local. Le choix n'est pas décoratif :
# c'est l'approche du golfe de Finlande, dans la zone couverte par le flux
# AIS public finlandais. Le scénario écrit à la main et le trafic réel
# tomberont donc sur la même carte, avec la même projection.
[origine]
lat = 59.85
lon = 24.85

[ownship]
