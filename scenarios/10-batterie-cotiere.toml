name = "Batterie côtière — détroit d'Ormuz"
brief = """Le porteur fait route vers le détroit d'Ormuz par le golfe d'Oman. Sur la
côte de la presqu'île de Musandam, une batterie de missiles antinavires ennemie
est signalée par le renseignement : c'est une installation fixe, à terre, dont
la position et la portée radar — trente milles — sont portées sur la carte. Dès
que le porteur entre dans cette zone, elle le verrouille, laisse trente
secondes, puis tire un missile toutes les deux minutes tant qu'il y reste. Un
pétrolier et une frégate alliée sont dans les parages."""
attendu = """La batterie ne bouge pas et ne se « détruit » pas : on lit sa zone sur la
carte et on l'évite, ou on y entre en connaissance de cause. Alerte « conduite
de tir ennemie » à l'entrée (avec le relèvement), puis « départ missile ». Les
missiles sont suivis dès leur départ de la batterie, de A à Z : un seul à la
fois, donc la console le suit. Leurres et SAM sur le missile en vol, demi-tour
hors de la zone pour couper les tirs suivants. Le CIWS ne tire pas seul."""

name_en = "Coastal battery — Strait of Hormuz"
brief_en = """Own ship heads for the Strait of Hormuz through the Gulf of Oman. On the
coast of the Musandam peninsula, an enemy anti-ship missile battery is reported
by intelligence: a fixed shore installation whose position and radar range —
thirty miles — are plotted on the chart. As soon as own ship enters this zone
it locks on, waits thirty seconds, then fires one missile every two minutes for
as long as own ship stays in. A tanker and an allied frigate are around."""
attendu_en = """The battery does not move and cannot be "destroyed": read its zone on
the chart and avoid it, or enter knowingly. "Enemy fire control" alert on entry
(with a bearing), then "missile launch". Missiles are tracked from the moment
they leave the battery, from A to Z: one at a time, so the console follows it.
Decoys and SAM on the missile in flight, a U-turn out of the zone to stop
further shots. CIWS does not fire on its own."""

