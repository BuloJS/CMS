# --- hostiles ----------------------------------------------------------
# HST-1 : vedette lance-missiles qui vient droit sur le porteur, conduite de
# tir allumée dès le départ — la doctrine la classe sans attendre.
[[contact]]
id = "HST-1"
name = "Vedette lance-missiles"
kind = "surf"
brg = 75
rng_nm = 22
course = 260
speed_kt = 28
rcs = 400
emitters = ["fc"]
intent = "hostile"

# HST-2 : corvette qui ne s'annonce d'abord que par son radar de veille et
# passe en conduite de tir à 300 s (événement plus bas).
[[contact]]
id = "HST-2"
name = "Corvette hostile"
kind = "surf"
brg = 100
rng_nm = 17
course = 265
speed_kt = 22
rcs = 2500
emitters = ["search"]
intent = "hostile"

# HST-3 : reste en veille radar toute la durée. Rien ne la classe seul, c'est
# à l'opérateur de le faire (et de décider s'il en a les éléments).
[[contact]]
id = "HST-3"
name = "Bâtiment hostile"
kind = "surf"
brg = 45
rng_nm = 15
course = 200
speed_kt = 18
rcs = 1800
emitters = ["search"]
intent = "hostile"

[[event]]
at = 300
type = "emitter"
from = "HST-2"
emitters = ["fc"]

[[event]]
at = 720
type = "launch"
from = "HST-1"
weapon = "asm"
count = 2
