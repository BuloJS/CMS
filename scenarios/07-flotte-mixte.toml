name = "Flotte mixte — dix bâtiments"
brief = """Rail Helsinki–Tallinn, dix bâtiments autour du porteur, une de chaque
affiliation que la console sait afficher : deux alliés qui répondent à l'IFF,
trois marchands honnêtes qui déclarent leur identité par AIS, deux contacts
silencieux qui ne disent rien, et trois bâtiments hostiles dont l'un allume sa
conduite de tir en cours de route. Rien n'est étiqueté : c'est aux senseurs et
à l'opérateur de faire le tri."""
attendu = """Les alliés passent AMI dès qu'ils sont pistés et interrogés ; les
marchands passent NEUTRE par leur AIS. Les deux silencieux restent INCONNUS —
c'est le comportement correct, l'absence de réponse n'est pas une hostilité.
Parmi les hostiles, ceux qui émettent en conduite de tir sont classés par
doctrine ; le troisième ne s'annonce que par son radar de veille et reste à
l'opérateur. À 720 s, l'un d'eux tire deux missiles antinavires."""

name_en = "Mixed fleet — ten vessels"
brief_en = """Helsinki–Tallinn lane, ten vessels around own ship, covering every
affiliation the console can show: two allies that answer IFF, three honest
merchants declaring their identity over AIS, two silent contacts that say
nothing, and three hostile vessels, one of which lights up its fire control
along the way. Nothing is labelled: sensors and operator have to sort it out."""
attendu_en = """Allies turn FRIEND as soon as they are tracked and interrogated;
merchants turn NEUTRAL from their AIS. The two silent ones stay UNKNOWN — the
correct behaviour, no answer is not hostility. Among the hostiles, those
radiating in fire control are classified by doctrine; the third only shows its
search radar and is left to the operator. At 720 s one of them fires two
anti-ship missiles."""

seed = 7007
duration = 900

# Même théâtre que les scénarios 01 à 05 : quinze milles d'eau libre dans
# toutes les directions. Les contacts sont posés surtout dans l'axe est-ouest,
# la côte finlandaise et la côte estonienne étant à ~15 et ~20 milles au nord
# et au sud — vérifié avec tools/eaux.py.
[origine]
lat = 59.90
lon = 25.25

[ownship]
course = 90
speed_kt = 12
mast_m = 30

# --- alliés : répondent à l'IFF, pas d'AIS (bâtiments de guerre) --------
[[contact]]
id = "FFG-HORIZON"
name = "Frégate alliée"
kind = "surf"
brg = 60
rng_nm = 6
course = 90
speed_kt = 12
rcs = 4000
iff = true
emitters = ["nav"]

